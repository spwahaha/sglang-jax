<svg xmlns="http://www.w3.org/2000/svg" width="1064" height="186" viewBox="0 0 1064 186" role="img" aria-labelledby="title desc"><title id="title">communication_flow.svg</title><desc id="desc">Routing and expert counts precede dispatch into expert queues, expert feed-forward computation, return of output rows, and weighted summation at the source. Some stages can overlap.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#65778a"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#172331"><rect x="12" y="34" width="184" height="92" rx="7" fill="#f1f3f5" stroke="#65778a" stroke-width="1.6"/><text x="104.0" y="74.12" text-anchor="middle" font-size="21" font-weight="normal"><tspan x="104.0" dy="0">Routing and</tspan><tspan x="104.0" dy="25.62">count exchange</tspan></text><rect x="226" y="34" width="184" height="92" rx="7" fill="#eaf2fa" stroke="#65778a" stroke-width="1.6"/><text x="318.0" y="74.12" text-anchor="middle" font-size="21" font-weight="normal"><tspan x="318.0" dy="0">Dispatch into</tspan><tspan x="318.0" dy="25.62">expert queues</tspan></text><rect x="440" y="34" width="184" height="92" rx="7" fill="#edf6f1" stroke="#65778a" stroke-width="1.6"/><text x="532.0" y="74.12" text-anchor="middle" font-size="21" font-weight="normal"><tspan x="532.0" dy="0">Selected</tspan><tspan x="532.0" dy="25.62">expert FFNs</tspan></text><rect x="654" y="34" width="184" height="92" rx="7" fill="#eaf2fa" stroke="#65778a" stroke-width="1.6"/><text x="746.0" y="74.12" text-anchor="middle" font-size="21" font-weight="normal"><tspan x="746.0" dy="0">Return expert</tspan><tspan x="746.0" dy="25.62">output rows</tspan></text><rect x="868" y="34" width="184" height="92" rx="7" fill="#f1f3f5" stroke="#65778a" stroke-width="1.6"/><text x="960.0" y="74.12" text-anchor="middle" font-size="21" font-weight="normal"><tspan x="960.0" dy="0">Source applies</tspan><tspan x="960.0" dy="25.62">weights and sum</tspan></text><path d="M196 80 L220 80" fill="none" stroke="#65778a" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M410 80 L434 80" fill="none" stroke="#65778a" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M624 80 L648 80" fill="none" stroke="#65778a" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M838 80 L862 80" fill="none" stroke="#65778a" stroke-width="2.2" marker-end="url(#arrow)"/><text x="530" y="163" text-anchor="middle" font-size="21" font-weight="normal"><tspan x="530" dy="0">Logical stages shown; DMA and compute can overlap.</tspan></text></g></svg>
