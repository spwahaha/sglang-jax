<svg xmlns="http://www.w3.org/2000/svg" width="1064" height="400" viewBox="0 0 1064 400" role="img" aria-labelledby="title desc"><title id="title">Communication and expert compute overlap</title><desc id="desc">Illustrative ordering with no timing scale. Baseline expert receives, computation, and output returns can overlap. The rank prototype builds row indices while receiving, then waits for its full inbox before expert computation. This is not a measured trace.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#172331"><text x="14" y="26" font-size="23" font-weight="bold">BASELINE Per expert readiness and streamed returns</text><text x="14" y="74" font-size="20" font-weight="normal">Input DMA</text><text x="14" y="118" font-size="20" font-weight="normal">Expert FFN</text><text x="14" y="162" font-size="20" font-weight="normal">Return DMA</text><rect x="160" y="50" width="146" height="34" rx="5" fill="#eaf2fa" stroke="#65778a" stroke-width="1.4"/><text x="233.0" y="73" text-anchor="middle" font-size="20">E0 input</text><rect x="310" y="94" width="146" height="34" rx="5" fill="#edf6f1" stroke="#65778a" stroke-width="1.4"/><text x="383.0" y="117" text-anchor="middle" font-size="20">E0 FFN</text><rect x="460" y="138" width="146" height="34" rx="5" fill="#eaf2fa" stroke="#65778a" stroke-width="1.4"/><text x="533.0" y="161" text-anchor="middle" font-size="20">E0 output</text><rect x="310" y="50" width="146" height="34" rx="5" fill="#eaf2fa" stroke="#65778a" stroke-width="1.4"/><text x="383.0" y="73" text-anchor="middle" font-size="20">E1 input</text><rect x="460" y="94" width="146" height="34" rx="5" fill="#edf6f1" stroke="#65778a" stroke-width="1.4"/><text x="533.0" y="117" text-anchor="middle" font-size="20">E1 FFN</text><rect x="610" y="138" width="146" height="34" rx="5" fill="#eaf2fa" stroke="#65778a" stroke-width="1.4"/><text x="683.0" y="161" text-anchor="middle" font-size="20">E1 output</text><rect x="460" y="50" width="146" height="34" rx="5" fill="#eaf2fa" stroke="#65778a" stroke-width="1.4"/><text x="533.0" y="73" text-anchor="middle" font-size="20">E2 input</text><rect x="610" y="94" width="146" height="34" rx="5" fill="#edf6f1" stroke="#65778a" stroke-width="1.4"/><text x="683.0" y="117" text-anchor="middle" font-size="20">E2 FFN</text><rect x="760" y="138" width="146" height="34" rx="5" fill="#eaf2fa" stroke="#65778a" stroke-width="1.4"/><text x="833.0" y="161" text-anchor="middle" font-size="20">E2 output</text><text x="14" y="221" font-size="23" font-weight="bold">RANK PROTOTYPE Full inbox readiness before the expert loop</text><text x="14" y="268" font-size="20" font-weight="normal">Input DMA</text><rect x="160" y="244" width="350" height="34" rx="5" fill="#eaf2fa" stroke="#65778a" stroke-width="1.4"/><text x="335.0" y="267" text-anchor="middle" font-size="20">Rank inbox transfers</text><text x="14" y="312" font-size="20" font-weight="normal">Local work</text><rect x="310" y="288" width="200" height="34" rx="5" fill="#f1f3f5" stroke="#65778a" stroke-width="1.4"/><text x="410.0" y="311" text-anchor="middle" font-size="20">Build row indices</text><text x="14" y="356" font-size="20" font-weight="normal">Expert FFN</text><rect x="544" y="332" width="146" height="34" rx="5" fill="#edf6f1" stroke="#65778a" stroke-width="1.4"/><text x="617.0" y="355" text-anchor="middle" font-size="20">E0 FFN</text><rect x="694" y="332" width="146" height="34" rx="5" fill="#edf6f1" stroke="#65778a" stroke-width="1.4"/><text x="767.0" y="355" text-anchor="middle" font-size="20">E1 FFN</text><rect x="844" y="332" width="146" height="34" rx="5" fill="#edf6f1" stroke="#65778a" stroke-width="1.4"/><text x="917.0" y="355" text-anchor="middle" font-size="20">E2 FFN</text><path d="M527 239 L527 370" stroke="#65778a" stroke-width="2" stroke-dasharray="6 5"/><text x="546" y="269" font-size="20" font-weight="bold">Full inbox wait completes</text><text x="14" y="391" font-size="19" font-weight="