<svg xmlns="http://www.w3.org/2000/svg" width="1072" height="313" viewBox="0 0 1072 313" role="img" aria-labelledby="title desc"><title id="title">destination_combine.svg</title><desc id="desc">Destination ranks weight local expert outputs and accumulate FP32 partials pA and pB for a source token. One partial per participating rank returns to the source, which sums them. Every expert output is still computed.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#65778a"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#172331"><rect x="20" y="41" width="268" height="75" rx="7" fill="#eaf2fa" stroke="#65778a" stroke-width="1.6"/><text x="154.0" y="72.34" text-anchor="middle" font-size="22" font-weight="normal"><tspan x="154.0" dy="0">Rank A expert outputs</tspan><tspan x="154.0" dy="26.84">w0 y0 + w1 y1</tspan></text><rect x="20" y="164" width="268" height="75" rx="7" fill="#edf6f1" stroke="#65778a" stroke-width="1.6"/><text x="154.0" y="195.34" text-anchor="middle" font-size="22" font-weight="normal"><tspan x="154.0" dy="0">Rank B expert outputs</tspan><tspan x="154.0" dy="26.84">w8 y8 + w9 y9</tspan></text><rect x="398" y="41" width="253" height="75" rx="7" fill="#eaf2fa" stroke="#65778a" stroke-width="1.6"/><text x="524.5" y="72.62" text-anchor="middle" font-size="21" font-weight="normal"><tspan x="524.5" dy="0">FP32 partial pA</tspan><tspan x="524.5" dy="25.62">one row for this token</tspan></text><rect x="398" y="164" width="253" height="75" rx="7" fill="#edf6f1" stroke="#65778a" stroke-width="1.6"/><text x="524.5" y="195.62" text-anchor="middle" font-size="21" font-weight="normal"><tspan x="524.5" dy="0">FP32 partial pB</tspan><tspan x="524.5" dy="25.62">one row for this token</tspan></text><rect x="800" y="103" width="252" height="75" rx="7" fill="#f1f3f5" stroke="#65778a" stroke-width="1.6"/><text x="926.0" y="134.06" text-anchor="middle" font-size="23" font-weight="normal"><tspan x="926.0" dy="0">Source result</tspan><tspan x="926.0" dy="28.06">pA + pB</tspan></text><path d="M288 79 L391 79" fill="none" stroke="#65778a" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M288 202 L391 202" fill="none" stroke="#65778a" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M651 79 L793 124" fill="none" stroke="#65778a" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M651 202 L793 156" fill="none" stroke="#65778a" stroke-width="2.2" marker-end="url(#arrow)"/><text x="533" y="288" text-anchor="middle" font-size="21" font-weight="normal"><tspan x="533" dy="0">BF16 expert rows become FP32 rank partials; byte savings depend on fanout.</tspan></text></g></svg>
