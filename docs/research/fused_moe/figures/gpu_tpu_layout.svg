<svg xmlns="http://www.w3.org/2000/svg" width="1064" height="344" viewBox="0 0 1064 344" role="img" aria-labelledby="title desc"><title id="title">gpu_tpu_layout.svg</title><desc id="desc">DeepEP recommended dispatch expands and aligns rank-delivered tokens into expert segments for grouped GEMM. The TPU experimental rank path uses a flat inbox and copies indexed rows into expert tiles after inbox readiness.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#65778a"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#172331"><text x="24" y="29" text-anchor="start" font-size="23" font-weight="bold"><tspan x="24" dy="0">DEEPEP EXPANDED PATH</tspan></text><rect x="22" y="48" width="300" height="79" rx="7" fill="#eaf2fa" stroke="#65778a" stroke-width="1.6"/><text x="172.0" y="81.06" text-anchor="middle" font-size="23" font-weight="normal"><tspan x="172.0" dy="0">Rank-oriented</tspan><tspan x="172.0" dy="28.06">delivery</tspan></text><rect x="382" y="48" width="300" height="79" rx="7" fill="#eaf2fa" stroke="#65778a" stroke-width="1.6"/><text x="532.0" y="81.06" text-anchor="middle" font-size="23" font-weight="normal"><tspan x="532.0" dy="0">Expand and align</tspan><tspan x="532.0" dy="28.06">expert segments</tspan></text><rect x="742" y="48" width="300" height="79" rx="7" fill="#eaf2fa" stroke="#65778a" stroke-width="1.6"/><text x="892.0" y="81.06" text-anchor="middle" font-size="23" font-weight="normal"><tspan x="892.0" dy="0">Grouped</tspan><tspan x="892.0" dy="28.06">expert GEMM</tspan></text><path d="M322 88 L375 88" fill="none" stroke="#65778a" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M682 88 L735 88" fill="none" stroke="#65778a" stroke-width="2.2" marker-end="url(#arrow)"/><text x="24" y="177" text-anchor="start" font-size="23" font-weight="bold"><tspan x="24" dy="0">TPU RANK PROTOTYPE</tspan></text><rect x="22" y="196" width="300" height="79" rx="7" fill="#edf6f1" stroke="#65778a" stroke-width="1.6"/><text x="172.0" y="229.06" text-anchor="middle" font-size="23" font-weight="normal"><tspan x="172.0" dy="0">Flat rank</tspan><tspan x="172.0" dy="28.06">inbox</tspan></text><rect x="382" y="196" width="300" height="79" rx="7" fill="#edf6f1" stroke="#65778a" stroke-width="1.6"/><text x="532.0" y="229.06" text-anchor="middle" font-size="23" font-weight="normal"><tspan x="532.0" dy="0">Inbox wait and</tspan><tspan x="532.0" dy="28.06">indexed row copies</tspan></text><rect x="742" y="196" width="300" height="79" rx="7" fill="#edf6f1" stroke="#65778a" stroke-width="1.6"/><text x="892.0" y="229.06" text-anchor="middle" font-size="23" font-weight="normal"><tspan x="892.0" dy="0">Contiguous tiles</tspan><tspan x="892.0" dy="28.06">for expert FFN</tspan></text><path d="M322 235 L375 235" fill="none" stroke="#65778a" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M682 235 L735 235" fill="none" stroke="#65778a" stroke-width="2.2" marker-end="url(#arrow)"/><text x="532" y="319" text-anchor="middle" font-size="22" font-weight="normal"><tspan x="532" dy="0">Input fanout still exists; its placement and scheduling differ.</tspan></text></g></svg>
