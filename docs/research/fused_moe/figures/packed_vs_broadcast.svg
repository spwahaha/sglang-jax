<svg xmlns="http://www.w3.org/2000/svg" width="1072" height="339" viewBox="0 0 1072 339" role="img" aria-labelledby="title desc"><title id="title">packed_vs_broadcast.svg</title><desc id="desc">Token t0 needs rank A and t1 needs rank B. Packed dispatch sends t0 to A and t1 to B. Dense broadcast sends the original two-token block to both ranks directly from HBM, and receivers select useful rows.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#65778a"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#172331"><text x="22" y="28" text-anchor="start" font-size="23" font-weight="bold"><tspan x="22" dy="0">PACK SELECTED ROWS</tspan></text><text x="574" y="28" text-anchor="start" font-size="23" font-weight="bold"><tspan x="574" dy="0">BROADCAST DENSE BLOCK</tspan></text><rect x="22" y="103" width="178" height="78" rx="7" fill="#f1f3f5" stroke="#65778a" stroke-width="1.6"/><text x="111.0" y="135.84" text-anchor="middle" font-size="22" font-weight="normal"><tspan x="111.0" dy="0">HBM block</tspan><tspan x="111.0" dy="26.84">[t0, t1]</tspan></text><rect x="333" y="55" width="170" height="74" rx="7" fill="#eaf2fa" stroke="#65778a" stroke-width="1.6"/><text x="418.0" y="85.84" text-anchor="middle" font-size="22" font-weight="normal"><tspan x="418.0" dy="0">Rank A</tspan><tspan x="418.0" dy="26.84">[t0]</tspan></text><rect x="333" y="188" width="170" height="74" rx="7" fill="#edf6f1" stroke="#65778a" stroke-width="1.6"/><text x="418.0" y="218.84" text-anchor="middle" font-size="22" font-weight="normal"><tspan x="418.0" dy="0">Rank B</tspan><tspan x="418.0" dy="26.84">[t1]</tspan></text><path d="M200 127 L326 91" fill="none" stroke="#65778a" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M200 158 L326 225" fill="none" stroke="#65778a" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="574" y="103" width="178" height="78" rx="7" fill="#f1f3f5" stroke="#65778a" stroke-width="1.6"/><text x="663.0" y="135.84" text-anchor="middle" font-size="22" font-weight="normal"><tspan x="663.0" dy="0">HBM block</tspan><tspan x="663.0" dy="26.84">[t0, t1]</tspan></text><rect x="885" y="55" width="170" height="74" rx="7" fill="#eaf2fa" stroke="#65778a" stroke-width="1.6"/><text x="970.0" y="85.84" text-anchor="middle" font-size="22" font-weight="normal"><tspan x="970.0" dy="0">Rank A</tspan><tspan x="970.0" dy="26.84">[t0, t1]</tspan></text><rect x="885" y="188" width="170" height="74" rx="7" fill="#edf6f1" stroke="#65778a" stroke-width="1.6"/><text x="970.0" y="218.84" text-anchor="middle" font-size="22" font-weight="normal"><tspan x="970.0" dy="0">Rank B</tspan><tspan x="970.0" dy="26.84">[t0, t1]</tspan></text><path d="M752 127 L878 91" fill="none" stroke="#65778a" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M752 158 L878 225" fill="none" stroke="#65778a" stroke-width="2.2" marker-end="url(#arrow)"/><text x="264" y="312" text-anchor="middle" font-size="22" font-weight="bold"><tspan x="264" dy="0">2 rows total; source packing</tspan></text><text x="813" y="312" text-anchor="middle" font-size="22" font-weight="bold"><tspan x="813" dy="0">4 rows total; receiver filters</tspan></text></g></svg>
