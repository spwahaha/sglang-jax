<svg xmlns="http://www.w3.org/2000/svg" width="1072" height="360" viewBox="0 0 1072 360" role="img" aria-labelledby="title desc"><title id="title">rank_deduplication.svg</title><desc id="desc">One token selects experts e0 and e1 on rank A and e8 and e9 on rank B. Expert dispatch makes four copies. Exact rank deduplication delivers one copy to each rank, followed by local fanout to the same four experts.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#65778a"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#172331"><text x="25" y="28" text-anchor="start" font-size="23" font-weight="bold"><tspan x="25" dy="0">EXPERT DISPATCH</tspan></text><text x="575" y="28" text-anchor="start" font-size="23" font-weight="bold"><tspan x="575" dy="0">EXACT RANK DEDUPLICATION</tspan></text><rect x="22" y="106" width="110" height="70" rx="7" fill="#f1f3f5" stroke="#65778a" stroke-width="1.6"/><text x="77.0" y="148.26" text-anchor="middle" font-size="22" font-weight="normal"><tspan x="77.0" dy="0">Token x</tspan></text><rect x="254" y="61" width="240" height="96" rx="7" fill="#eaf2fa" stroke="#65778a" stroke-width="1.6"/><text x="374.0" y="102.84" text-anchor="middle" font-size="22" font-weight="normal"><tspan x="374.0" dy="0">Rank A</tspan><tspan x="374.0" dy="26.84">e0 gets x   e1 gets x</tspan></text><rect x="254" y="190" width="240" height="96" rx="7" fill="#edf6f1" stroke="#65778a" stroke-width="1.6"/><text x="374.0" y="231.84" text-anchor="middle" font-size="22" font-weight="normal"><tspan x="374.0" dy="0">Rank B</tspan><tspan x="374.0" dy="26.84">e8 gets x   e9 gets x</tspan></text><path d="M132 125 L247 88" fill="none" stroke="#65778a" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M132 145 L247 130" fill="none" stroke="#65778a" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M132 153 L247 217" fill="none" stroke="#65778a" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M132 163 L247 258" fill="none" stroke="#65778a" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="572" y="106" width="110" height="70" rx="7" fill="#f1f3f5" stroke="#65778a" stroke-width="1.6"/><text x="627.0" y="148.26" text-anchor="middle" font-size="22" font-weight="normal"><tspan x="627.0" dy="0">Token x</tspan></text><rect x="812" y="61" width="240" height="96" rx="7" fill="#eaf2fa" stroke="#65778a" stroke-width="1.6"/><text x="932.0" y="103.12" text-anchor="middle" font-size="21" font-weight="normal"><tspan x="932.0" dy="0">Rank A receives x</tspan><tspan x="932.0" dy="25.62">Fan out to e0 and e1</tspan></text><rect x="812" y="190" width="240" height="96" rx="7" fill="#edf6f1" stroke="#65778a" stroke-width="1.6"/><text x="932.0" y="232.12" text-anchor="middle" font-size="21" font-weight="normal"><tspan x="932.0" dy="0">Rank B receives x</tspan><tspan x="932.0" dy="25.62">Fan out to e8 and e9</tspan></text><path d="M682 130 L805 108" fill="none" stroke="#65778a" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M682 155 L805 236" fill="none" stroke="#65778a" stroke-width="2.2" marker-end="url(#arrow)"/><text x="265" y="333" text-anchor="middle" font-size="23" font-weight="bold"><tspan x="265" dy="0">4 activation copies</tspan></text><text x="805" y="333" text-anchor="middle" font-size="23" font-weight="bold"><tspan x="805" dy="0">2 deliveries plus local fanout</tspan></text></g></svg>
